<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!--TDBV:1022 TDBA:5-->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Prise de notes Ciolek</title>
<style>
:root{
  /* même thème que le tableau de bord : fond #0f1114, tuiles translucides (fond 50 %) cerclées de #2f353e */
  --bg:#0f1114;--card:rgba(26,30,36,.5);--solid:#1a1e24;--ink:#eceff3;--mute:#8f98a5;--line:#2f353e;--acc:#748ffc;--acc-ink:#0f1114;--danger:#ff7a70;--shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;touch-action:manipulation}
body{min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 24px) env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;font-size:16px;color:var(--ink)}
header.top{position:relative;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:none}
#app{position:relative;z-index:1}
header.top h1.long{font-size:23px}
header.top h1{flex:1;margin:0;font-size:26px;letter-spacing:-.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{min-width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:34px;line-height:1;color:var(--acc)}
.ib svg{width:30px;height:30px;pointer-events:none}
.ib.spin svg{animation:spn 1s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ib.spin svg{animation:none;opacity:.5}}
.ib.txt{font-size:20px;padding:0 6px;justify-content:flex-start}
main{padding:0 16px}
.search{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;margin:2px 0 14px;outline:none}
.libH{padding:2px 4px 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mi{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative;aspect-ratio:1/1;min-width:0;border-radius:16px;border:2px solid var(--line);padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:700;color:var(--ink);text-align:center;overflow-wrap:normal;line-height:1.15}
.mi:active{background:rgba(255,255,255,.08)}
.mods.m3{grid-template-columns:repeat(3,1fr);gap:10px}
.m3 .mi{font-size:14px;padding:30px 6px 6px;gap:8px;justify-content:flex-start}
.m3 .mi span:last-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word}
.m3 .mi svg{width:46px;height:46px}
.m3 .mi .bd{top:7px;right:7px;min-width:24px;height:24px;border-radius:12px;font-size:13px}
.mi.ph{opacity:.3}
.dragclone{position:fixed;z-index:50;margin:0;pointer-events:none;transform:scale(1.07);opacity:.92;box-shadow:0 14px 30px rgba(0,0,0,.55)}
/* ---- fonds d'écran ---- */
#wp{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg);pointer-events:none}
#wp::after{content:"";position:absolute;inset:0;background:rgba(8,10,14,.28)}
#wp.wp-nuit::after{display:none}
#wp.wp-ocean{background:linear-gradient(160deg,#0b2447,#19376d 45%,#0a7d9b)}
#wp.wp-foret{background:linear-gradient(160deg,#07140f,#0e3b2b 55%,#1d6b4a)}
#wp.wp-crep{background:linear-gradient(170deg,#1a1038,#4a1d6b 45%,#c2410c)}
#wp.wp-braise{background:linear-gradient(165deg,#140808,#4a1414 50%,#9a3412)}
#wp canvas{position:absolute;inset:0;width:100%;height:100%}
.wpgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.wpt{position:relative;aspect-ratio:3/4;border-radius:14px;border:2px solid var(--line);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding:0 4px 8px;font-size:13px;font-weight:700;color:#fff;text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.7);background:var(--pv)}
.wpt *{pointer-events:none}
.wpt .wpc{position:absolute;inset:0;width:100%;height:100%}
.wpt .lb{position:relative;z-index:1}
.wpt.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.wpt .ok{z-index:2;position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:11px;background:var(--acc);color:var(--acc-ink);font-size:14px;line-height:22px}
.wpt .an{z-index:2;position:absolute;top:6px;left:6px;font-size:10px;letter-spacing:.04em;padding:2px 6px;border-radius:8px;background:rgba(0,0,0,.45)}
/* ---- ordinateur : colonne centrée, tuiles de taille fixe ---- */
@media (min-width:700px){
  #app{max-width:900px;margin:0 auto}
  header.top{padding:22px 16px 14px}
  header.top h1{font-size:30px}
  .search{max-width:520px}
  .mods,.mods.m3{grid-template-columns:repeat(auto-fill,125px);gap:13px;justify-content:start}
  .wpgrid{grid-template-columns:repeat(auto-fill,125px);gap:13px;justify-content:start}
  .mi,.m3 .mi{font-size:13.5px;gap:7px;border-radius:15px}
  .m3 .mi{padding:26px 3px 4px;font-size:13px}
  .mi svg,.m3 .mi svg{width:38px;height:38px}
  .mi .bd,.m3 .mi .bd{top:6px;right:6px;min-width:21px;height:21px;font-size:12px;border-radius:11px}
  .wpt{font-size:13px}
  .box{max-width:620px}
  .fbi{max-width:620px}
  #modal{align-items:center}
  #modal .sheet{max-width:480px;border-radius:18px}
  .mi:hover,.wpt:hover,.pill:hover,.btn:hover{filter:brightness(1.15)}
}
.mi.new{background:transparent;border-style:dashed;color:var(--mute)}
.mi.new svg{color:var(--mute)}
.mi *{pointer-events:none}
.mi svg{width:48px;height:48px;display:block;color:var(--c)}
.mi .bd{position:absolute;top:6px;right:6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 14px;box-shadow:var(--shadow);overflow:hidden}
.sec .sh{display:flex;align-items:center;padding:4px 6px 4px 14px;min-height:48px}
.sec .sh h2{flex:1;margin:0;font-size:16px;text-transform:none;letter-spacing:0;color:var(--c,var(--ink))}
.sec .sh .cnt{color:var(--mute);font-size:14px;margin-right:2px}
.note{display:flex;align-items:flex-start;gap:6px;padding:0 6px 0 4px;border-top:1px solid var(--line)}
.sec .sh+.note{border-top:0}
.chk{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.chk i{width:24px;height:24px;border-radius:50%;border:2px solid var(--mute);display:block;position:relative}
.note.done .chk i{background:var(--c,var(--acc));border-color:var(--c,var(--acc))}
.note.done .chk i::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--acc-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.nt{flex:1;text-align:left;padding:10px 4px;min-height:44px;overflow-wrap:anywhere;white-space:pre-wrap}
.box textarea.fbt{width:100%;height:96px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:12px;outline:none;resize:none;font:16px/1.35 -apple-system,system-ui,sans-serif}
.fbrow>span{flex:0 0 100%}
.fbrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--mute)}
.pill{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600;font-size:14px}
.pill:active{background:rgba(255,255,255,.1)}
.fbi{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--t);border-radius:14px;padding:10px 6px 10px 12px;margin:0 0 8px}
.fbi>b{flex:none;width:78px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--t);padding-top:3px}
.fbi>div{flex:1;min-width:0;overflow-wrap:anywhere}
.fbi small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.xdel{flex:none;width:44px;height:44px;margin-right:-6px;font-size:30px;line-height:1;color:var(--mute);display:flex;align-items:center;justify-content:center}
.xdel:active{color:var(--bad,#ff6b6b)}
.nt small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.note.done .nt{color:var(--mute);text-decoration:line-through}
.add{display:flex;gap:8px;padding:8px 10px 10px;border-top:1px solid var(--line)}
.add input{flex:1;min-width:0;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;outline:none}
.add button{height:42px;padding:0 14px;border-radius:10px;background:var(--acc);color:var(--acc-ink);font-weight:600}
.empty{color:var(--mute);padding:6px 16px 10px;font-size:15px}
.big{display:block;width:100%;height:48px;border-radius:14px;border:1.5px dashed var(--mute);color:var(--acc);font-weight:600;margin:4px 0 14px}
.res{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.res button{display:block;width:100%;text-align:left;padding:10px 16px;border-top:1px solid var(--line);overflow-wrap:anywhere}
.res button:first-child{border-top:0}
.res .rrow{display:flex;align-items:center;border-top:1px solid var(--line)}
.res .rrow:first-child{border-top:0}
.res .rrow button.ro{flex:1;border-top:0}
.res .rrow .xdel{flex:none;width:52px;height:52px;margin:0;padding:0;border-top:0;text-align:center}
.res small{display:block;color:var(--mute);font-size:13px}
.hint{color:var(--mute);font-size:14px;margin:0 2px 10px}
.banner{margin:0 0 12px;background:var(--acc);color:var(--acc-ink);border-radius:12px;padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.warn{background:var(--danger);color:#fff;display:block;font-weight:500}
.banner button{background:rgba(255,255,255,.25);border-radius:8px;padding:6px 12px;font-weight:600}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin:0 0 14px}
.box h3{margin:0 0 6px;font-size:16px}
.box p{margin:0 0 10px;color:var(--mute);font-size:14px}
.box textarea{width:100%;height:110px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:10px;outline:none;font:12px/1.3 ui-monospace,Menlo,monospace;resize:none}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.fld{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;margin:2px 0 8px;outline:none}
.btn{height:42px;padding:0 16px;border-radius:10px;background:var(--acc);color:var(--acc-ink);font-weight:600}
.btn.sec2{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.dng{background:var(--danger);color:#fff}
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{width:100%;max-width:560px;background:var(--solid);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px)}
.sheet h3{margin:0 0 10px;font-size:18px}
.sheet p{margin:0 0 12px;color:var(--mute)}
.sheet input,.sheet textarea{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;outline:none;margin-bottom:12px}
.sheet textarea{height:130px;resize:none}
.sheet .row{margin-top:0}
.sheet .row .btn{flex:1}
.sheet .mitem{display:block;width:100%;text-align:left;padding:14px 4px;border-top:1px solid var(--line);font-size:17px}
.sheet .mitem.dng{color:var(--danger)}
#toast{border:1px solid var(--line);position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);max-width:88%;padding:11px 18px;border-radius:14px;background:var(--solid);color:var(--ink);font-size:15px;z-index:30;display:none;text-align:center}
#toast.bad{background:var(--danger)}
</style>

<body>
<div id="wp"></div><div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
window.MEMO_RH = true;
(function () {
  "use strict";
  var UI_CODE = parseInt("1022", 10) || 0, UI_NAME = "1.22";
  var REPO = { owner: "ClementLGS", repo: "memo-maman", branch: "main" };
  /* Dépôt des mises à jour : « propriétaire/nom » ou « propriétaire/nom@branche » (réglage D.upd), sinon le dépôt par défaut. */
  function parseSrc(s) {
    var m = /^\s*([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+)(?:@([A-Za-z0-9_.\/-]+))?\s*$/.exec(String(s || ""));
    return m ? { owner: m[1], repo: m[2], branch: m[3] || "main" } : null;
  }
  function srcOf() { return (D && parseSrc(D.upd)) || REPO; }
  function srcStr(r) { return r.owner + "/" + r.repo + (r.branch !== "main" ? "@" + r.branch : ""); }
  var KEY = "memo-rh-data";
  var NATIVE = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.native);
  var DEFAULT = [
    ["À faire", ["Hebdomadaire", "Mensuel"]],
    ["RH", ["Congés", "Salaire", "Heures pointage", "Formation", "Frais", "Arrêt maladie", "Alternance", "Intérimaire"]],
    ["Client", ["Commande client", "Relance client", "Caution bancaire", "Facturation client"]],
    ["Fournisseur", ["Facture fournisseur", "Achat / commande", "Virement fournisseur"]],
    ["Réunion", []],
    ["Litige", ["Avocat"]],
    ["Comptabilité", ["Pennylane dépôt", "Virement client", "Virement fournisseur", "Bilan", "Banque", "Virement salarié", "Pennylane rapprochement"]],
    ["Juridique", []]
  ];

  /* ---------- pont avec l'appli native ---------- */
  function sync(m, a) {
    var r;
    try { r = window.prompt("__tdb", JSON.stringify({ m: m, a: a })); } catch (e) { r = null; }
    return r == null ? "" : String(r);
  }
  function post(m, a) { try { window.webkit.messageHandlers.native.postMessage({ m: m, a: a }); } catch (e) { } }
  var pend = {}, nid = 0;
  window.__nat = function (id, st, body, err) { var cb = pend[id]; delete pend[id]; if (cb) { cb(st, body, err); } };
  function httpGet(url, headers, cb) { var id = ++nid; pend[id] = cb; post("httpGet", [id, url, headers || {}]); }

  /* ---------- données ---------- */
  var D = null, locked = false, lockMsg = "";
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function defCat(d) {
    return { id: uid(), name: d[0], notes: [], subs: d[1].map(function (n) { return { id: uid(), name: n, notes: [] }; }) };
  }
  function defaults() { return { v: 5, tomb: {}, fb: [], wp: "nuit", cats: DEFAULT.map(defCat) }; }
  function norm(s) { return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim(); }
  /* Données d'une ancienne version : on garde tout ce qui existe, on ajoute les catégories et sous-catégories qui manquent, on remet l'ordre de la feuille. */
  function migrate(d) {
    var changed = false, i;
    if ((d.v || 1) < 2) {
      DEFAULT.forEach(function (def) {
        var c = null, i;
        for (i = 0; i < d.cats.length; i++) { if (norm(d.cats[i].name) === norm(def[0])) { c = d.cats[i]; break; } }
        if (!c) { d.cats.push(defCat(def)); return; }
        def[1].forEach(function (sn) {
          var ok = c.subs.some(function (s) { return norm(s.name) === norm(sn); });
          if (!ok) { c.subs.push({ id: uid(), name: sn, notes: [] }); }
        });
      });
      var rank = function (c) { var k; for (k = 0; k < DEFAULT.length; k++) { if (norm(DEFAULT[k][0]) === norm(c.name)) { return k; } } return 99; };
      d.cats = d.cats.map(function (c, k) { return { c: c, i: k }; }).sort(function (x, y) { return rank(x.c) - rank(y.c) || x.i - y.i; }).map(function (x) { return x.c; });
      d.v = 2; changed = true;
    }
    if (d.v < 4) { /* v4 : Feedback devient un écran à part (D.fb) ; les notes de la catégorie 1.9 y sont reprises */
      d.fb = d.fb || [];
      for (i = d.cats.length - 1; i >= 0; i--) {
        if (norm(d.cats[i].name) === "feedback") {
          var fc = d.cats[i];
          fc.notes.forEach(function (n) { d.fb.push({ id: uid(), k: "amel", t: n.t, ts: n.ts || Date.now(), ver: "1.9" }); });
          fc.subs.forEach(function (sb) {
            sb.notes.forEach(function (n) { d.fb.push({ id: uid(), k: norm(sb.name) === "bugs" ? "bug" : norm(sb.name) === "idees" ? "idee" : "amel", t: n.t, ts: n.ts || Date.now(), ver: "1.9" }); });
          });
          d.cats.splice(i, 1);
        }
      }
      d.v = 4; changed = true;
    }
    if (d.v < 5) { /* v5 : synchronisation entre appareils (suppressions mémorisées, ordre choisi daté) */
      d.tomb = d.tomb || {};
      var cr = d.cats.map(function (c) { return rankCat(c.name); }), custom = cr.some(function (x, k) { return k && x < cr[k - 1]; });
      if (custom) { d.ord = Date.now(); }
      d.cats.forEach(function (c) { var sr = c.subs.map(function (sb) { return rankSub(c.name, sb.name); }); if (sr.some(function (x, k) { return k && x < sr[k - 1]; })) { c.so = Date.now(); } });
      d.v = 5; changed = true;
    }
    return changed;
  }
  function parseData(raw) {
    var d = JSON.parse(raw);
    if (!d || !Array.isArray(d.cats)) { throw new Error("format"); }
    d.fb = Array.isArray(d.fb) ? d.fb : []; d.tomb = (d.tomb && typeof d.tomb === "object") ? d.tomb : {}; if (typeof d.wp !== "string") { d.wp = "nuit"; }
    d.cats.forEach(function (c) { c.notes = c.notes || []; c.subs = c.subs || []; c.subs.forEach(function (s) { s.notes = s.notes || []; }); });
    return d;
  }
  var bkT = 0, bkErr = "", bkMsg = "";
  function save(quiet) {
    if (locked) { return false; }
    var s = JSON.stringify(D);
    if (NATIVE) {
      var r = sync("data.set", [s]);
      if (r !== "ok") { toast("Sauvegarde impossible : " + r.replace(/^err:/, ""), true); return false; }
    } else {
      try { window.localStorage.setItem(KEY, s); } catch (e) { }
    }
    if (!quiet) { clearTimeout(bkT); bkT = setTimeout(function () { syncNow(false); }, 8000); }
    return true;
  }
  function load() {
    var raw = "", r;
    if (NATIVE) {
      r = sync("data.get", []);
      if (r === "empty") { D = defaults(); save(); return; }
      if (r.indexOf("ok:") !== 0) {
        locked = true; lockMsg = "Le stockage de l'appli ne répond pas. Rien n'a été modifié : ferme complètement l'appli puis rouvre-la.";
        D = defaults(); return;
      }
      raw = r.slice(3);
    } else {
      try { raw = window.localStorage.getItem(KEY) || ""; } catch (e) { }
      if (!raw) { D = defaults(); save(); return; }
    }
    try { D = parseData(raw); if (migrate(D)) { save(); } } catch (e) {
      locked = true; lockMsg = "Le fichier de notes est illisible. Rien n'a été effacé : il est toujours dans Fichiers > Sur mon iPhone > Prise de notes Ciolek. Contacte Clément avant de continuer.";
      D = defaults();
    }
  }

  /* ---------- utilitaires ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function cat(id) { var i; for (i = 0; i < D.cats.length; i++) { if (D.cats[i].id === id) { return D.cats[i]; } } return null; }
  function sub(c, id) { var i; for (i = 0; i < c.subs.length; i++) { if (c.subs[i].id === id) { return c.subs[i]; } } return null; }
  function openCount(list) { return list.filter(function (n) { return !n.done; }).length; }
  function catOpen(c) { return c.subs.reduce(function (t, s) { return t + openCount(s.notes); }, openCount(c.notes)); }
  function color(i) { return i === 8 ? "hsl(40 88% 54%)" : "hsl(" + ((i * 53 + 222) % 360) + " 58% 52%)"; }

  function b64dec(s) { var bin = atob(String(s).replace(/\s/g, "")), b = new Uint8Array(bin.length), i; for (i = 0; i < bin.length; i++) { b[i] = bin.charCodeAt(i); } return new TextDecoder().decode(b); }
  window.__pull = function (st, sha, text) { var cb = pullCb; pullCb = null; if (cb) { cb(String(st), String(sha || ""), String(text || "")); } };
  window.__push = function (st, sha) { var cb = pushCb; pushCb = null; if (cb) { cb(String(st), String(sha || "")); } };
  function ghPull(cb) {
    var c;
    pullCb = cb;
    if (NATIVE) { post("bkPull", []); return; }
    c = ghStore();
    window.fetch("https://api.github.com/repos/" + c.repo + "/contents/notes.json?t=" + Date.now(), { headers: ghHead(c.token), cache: "no-store" }).then(function (r) {
      if (r.status === 404) { return window.__pull("none", "", ""); }
      if (r.status === 401 || r.status === 403) { return window.__pull("err:jeton refusé ou expiré", "", ""); }
      if (!r.ok) { return window.__pull("err:GitHub a répondu " + r.status, "", ""); }
      return r.json().then(function (o) {
        if (!o || typeof o.content !== "string" || !o.content) { return window.__pull("err:fichier distant vide ou trop gros", "", ""); }
        window.__pull("ok", o.sha, b64dec(o.content));
      });
    }).catch(function () { window.__pull("err:réseau indisponible", "", ""); });
  }
  function ghPush(text, sha, cb) {
    var c, body;
    pushCb = cb;
    if (NATIVE) { post("bkPush", [text, sha || ""]); return; }
    c = ghStore(); body = { message: "Synchronisation " + new Date().toISOString().slice(0, 16).replace("T", " "), content: b64enc(text) }; if (sha) { body.sha = sha; }
    window.fetch("https://api.github.com/repos/" + c.repo + "/contents/notes.json", { method: "PUT", headers: ghHead(c.token), body: JSON.stringify(body), cache: "no-store" }).then(function (r) {
      if (r.status === 200 || r.status === 201) { return r.json().then(function (o) { window.__push("ok", o && o.content && o.content.sha); }); }
      if (r.status === 409 || r.status === 422) { return window.__push("conflict", ""); }
      if (r.status === 401 || r.status === 403) { return window.__push("err:jeton refusé (droit « Contents : lecture et écriture » nécessaire)", ""); }
      if (r.status === 404) { return window.__push("err:dépôt introuvable, ou jeton sans accès à ce dépôt", ""); }
      window.__push("err:GitHub a répondu " + r.status, "");
    }).catch(function () { window.__push("err:réseau indisponible", ""); });
  }
  function userBusy() { var a = document.activeElement; return !!drag || !!press || (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) || view.n === "set"; }
  function syncNow(manual) {
    var i = bkInfo();
    if (!i.repo || !i.token) { manualSync = false; if (manual) { toast("Configure d'abord le dépôt et le jeton (Réglages).", true); } return; }
    if (locked) { return; }
    if (syncBusy) { syncAgain = true; return; }
    syncBusy = true; syncTries = 0; spinSync(true); syncCycle();
  }
  function spinSync(on) { var b = document.querySelectorAll("[data-a=syncbtn]"), i; for (i = 0; i < b.length; i++) { b[i].classList.toggle("spin", on); } }
  function syncFinish(res) {
    syncBusy = false; spinSync(false);
    if (manualSync) { manualSync = false; if (res.indexOf("err:") === 0) { toast("Synchronisation : " + res.slice(4), true); } else if (res.indexOf("ok") === 0) { toast(res === "ok:inchangé" ? "Tout est à jour." : "Synchronisé."); } }
    if (res.indexOf("ok") === 0) { try { window.localStorage.setItem(SYNCT, String(Math.floor(Date.now() / 1000))); } catch (e) { } }
    window.__bk(res);
    if (syncAgain) { syncAgain = false; setTimeout(function () { syncNow(false); }, 400); }
  }
  function syncCycle() {
    ghPull(function (st, sha, text) {
      var remote = null, M, needPush, applied = false;
      if (st.indexOf("err:") === 0) { return syncFinish(st); }
      if (st === "ok") {
        remote = parseRemote(text);
        if (!remote) { return syncFinish("err:le fichier notes.json du dépôt est illisible (rien n'a été écrasé)"); }
        M = isPristine(D) ? { v: 5, cats: remote.cats, tomb: remote.tomb, fb: D.fb || [], wp: D.wp || "nuit", ord: remote.ord, upd: D.upd } : mergeData(D, remote);
        if (canon(M) !== canon(D)) { D = M; applied = true; save(true); }
        needPush = canon(payload(D)) !== canon(payload(remote));
      } else { needPush = true; }
      if (applied && !userBusy()) { render(); spinSync(true); }
      if (!needPush) { return syncFinish("ok:inchangé"); }
      ghPush(JSON.stringify(payload(D), null, 1), sha, function (ps) {
        if (ps === "ok") { syncFinish(applied ? "ok:fusion" : "ok"); }
        else if (ps === "conflict" && ++syncTries < 4) { syncCycle(); }
        else { syncFinish(ps === "conflict" ? "err:conflit répété, réessaie" : ps); }
      });
    });
  }
  function bkRun(manual) { syncNow(manual); }
  window.__bk = function (res) {
    var m = $("bkmsg"), had = !!bkErr;
    res = String(res || "");
    if (res.indexOf("err:") === 0) { bkErr = res.slice(4); bkMsg = "Échec : " + bkErr; }
    else if (res.indexOf("ok") === 0) { bkErr = ""; bkMsg = res === "ok:inchangé" ? "Tout est à jour." : res === "ok:fusion" ? "Notes fusionnées avec celles de tes autres appareils." : "Synchronisé."; }
    else { return; }
    if (m) { m.textContent = bkMsg + (res.indexOf("ok") === 0 ? " " + bkLine(bkInfo()) : ""); }
    if (had !== !!bkErr && view.n !== "set") { render(); }
  };
  setTimeout(function () { syncNow(false); }, 3000);
  setInterval(function () { if (!document.hidden) { syncNow(false); } }, 90000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { syncNow(false); } });

  /* ---------- mises à jour de l'interface ---------- */
  var lastCheck = 0, busy = false;
  function say(m, auto) { updMsg = m; var e = $("updmsg"); if (e) { e.textContent = m; } if (!auto && !e) { toast(m); } }
  function otaSend(html, vj) {
    var i = 0, j, c;
    if (sync("ota.begin", []) !== "ok") { return "err:pont indisponible"; }
    while (i < html.length) {
      j = Math.min(i + 60000, html.length);
      c = html.charCodeAt(j - 1);
      if (j < html.length && c >= 0xD800 && c <= 0xDBFF) { j--; }
      if (sync("ota.chunk", [html.substring(i, j)]) !== "ok") { return "err:transfert interrompu"; }
      i = j;
    }
    return sync("ota.commit", [vj]);
  }
  /* GitHub garde ses fichiers « raw » ~5 min en cache : on demande d'abord le numéro exact du dernier commit, puis on lit les fichiers à cette adresse. */
  function updCheck(manual) {
    if (!NATIVE) { if (manual) { say("Mises à jour disponibles seulement dans l'appli installée."); } return; }
    if (busy) { return; }
    busy = true; lastCheck = Date.now();
    var R = srcOf(), raw = "https://raw.githubusercontent.com/" + R.owner + "/" + R.repo + "/";
    function fin(msg) { busy = false; if (msg) { say(msg, !manual); } }
    if (manual) { say("Recherche en cours…"); }
    httpGet("https://api.github.com/repos/" + R.owner + "/" + R.repo + "/commits/" + R.branch + "?t=" + Date.now(), { "Accept": "application/vnd.github.sha" }, function (st, body) {
      var sha = String(body || "").replace(/\s/g, ""), base = /^[0-9a-f]{40}$/.test(sha) ? raw + sha : raw + R.branch;
      httpGet(base + "/version.json?t=" + Date.now(), {}, function (st2, vtxt, err2) {
        var v;
        if (err2 || st2 !== 200) { return fin(manual ? "Recherche impossible (" + (err2 || "erreur " + st2) + ")." : ""); }
        try { v = JSON.parse(vtxt); } catch (e) { return fin(manual ? "Recherche impossible : version.json illisible." : ""); }
        if (typeof v.ui !== "number" || v.ui === UI_CODE) { return fin(manual ? "Déjà à jour (version " + UI_NAME + ")." : ""); }
        httpGet(base + "/index.html?t=" + Date.now(), {}, function (st3, html, err3) {
          if (err3 || st3 !== 200) { return fin(manual ? "Téléchargement impossible (" + (err3 || "erreur " + st3) + ")." : ""); }
          var r = otaSend(html, vtxt);
          if (r.indexOf("ok:") !== 0) { return fin(manual ? "Mise à jour refusée : " + r.replace(/^err:/, "") : ""); }
          busy = false; updReady = true; say("Version " + (v.name || v.ui) + " prête.", !manual);
          if (manual) { post("reloadUi", []); } else { render(); }
        });
      });
    });
  }
  setTimeout(function () { updCheck(false); }, 5000);
  setInterval(function () { updCheck(false); }, 6 * 3600 * 1000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && Date.now() - lastCheck > 3600 * 1000) { updCheck(false); } });
  window.addEventListener("pagehide", function () { save(); });

  load();
  wpApply();
  render();
})();
</script>
